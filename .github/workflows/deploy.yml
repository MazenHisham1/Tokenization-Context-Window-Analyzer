name: Deploy

# Render builds and starts the app itself (Render -> your service -> Settings -> Build & Deploy ->
# Auto-Deploy: "After CI Checks Pass"). This workflow does the part that gives you the link on GitHub:
# it waits until the new version answers, smoke-tests the live site, and records a "production"
# deployment, which shows up as "Deployments" on the repo page.
#
# Needs, in GitHub -> Settings -> Secrets and variables -> Actions -> Variables:
#   variable LIVE_URL   the public address, for example https://tokenization-analyzer.onrender.com
# Without LIVE_URL the job is skipped, so the workflow is harmless until you set it up. See docs/DEPLOY.md.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ vars.LIVE_URL != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    # An "environment" with a url is what makes GitHub show a "Deployments" entry with a link on the repo page.
    environment:
      name: production
      url: ${{ vars.LIVE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Wait until the site answers
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          # A sleeping free service needs about a minute to wake; a new build takes a few minutes.
          for i in $(seq 1 60); do
            if curl -fsS "$LIVE_URL/api/health" | grep -q '"ok"'; then echo "Live: $LIVE_URL"; exit 0; fi
            echo "not ready yet ($i/60)"; sleep 20
          done
          echo "The site did not answer within 20 minutes. Check the Logs tab of the service on Render."; exit 1

      - name: Smoke-test the live site
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          pip install pytest
          pytest e2e/test_live.py -q
